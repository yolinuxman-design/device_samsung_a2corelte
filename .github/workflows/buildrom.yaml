name: LineageOS 18.1 - a2corelte

on:
  workflow_dispatch:

env:
  ROM_DIR: ${{ github.workspace }}/lineage

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/go \
                     /usr/share/swift /usr/share/miniconda || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install build dependencies (Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison m4 bc build-essential zip curl unzip rsync \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            python-is-python3 openjdk-11-jdk schedtool lzop
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> "$GITHUB_ENV"
          sudo update-alternatives --set java  /usr/lib/jvm/java-11-openjdk-amd64/bin/java  || true
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac || true
          java -version

      - name: Add swap (runner has limited RAM)
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@example.com"
          git config --global user.name "a2corelte-ci"
          git config --global color.ui false

      - name: Init LineageOS 18.1 manifest + device repos
        run: |
          mkdir -p "$ROM_DIR/.repo/local_manifests"
          cd "$ROM_DIR"
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1
          cat > .repo/local_manifests/a2corelte.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="gh" fetch="https://github.com/" />
            <project name="yolinuxman-design/device_samsung_a2corelte" path="device/samsung/a2corelte" remote="gh" revision="main" />
            <project name="yolinuxman-design/android_device_samsung_universal7870-common" path="device/samsung/universal7870-common" remote="gh" revision="aex" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd "$ROM_DIR"
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          df -h /

      - name: Build
        run: |
          cd "$ROM_DIR"
          source build/envsetup.sh
          breakfast a2corelte
          mka bacon
          ls -lah out/target/product/a2corelte/*.zip || true
          df -h /

      - name: Upload ROM zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-18.1-a2corelte-run${{ github.run_number }}
          path: ${{ env.ROM_DIR }}/out/target/product/a2corelte/*.zip
          if-no-files-found: warn
          compression-level: 0

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-run${{ github.run_number }}
          path: |
            ${{ env.ROM_DIR }}/out/*.log
            ${{ env.ROM_DIR }}/out/soong.log
            ${{ env.ROM_DIR }}/out/target/product/a2corelte/*.log
          if-no-files-found: ignore
