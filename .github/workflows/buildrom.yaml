name: Build LineageOS 18.1 (a2corelte)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ROM_DIR: ${{ github.workspace }}/src

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Maximize runner space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Dependencies (Ubuntu 22.04 / LOS 18.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential zip unzip curl git rsync \
            libssl-dev libxml2-utils xsltproc fontconfig lzop schedtool \
            python-is-python3 openjdk-11-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> "$GITHUB_ENV"
          sudo update-alternatives --set java  /usr/lib/jvm/java-11-openjdk-amd64/bin/java  || true
          sudo update-alternatives --set javac /usr/lib/jvm/java-11-openjdk-amd64/bin/javac || true
          java -version

      - name: Repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ci"
          git config --global user.email "ci@ci.local"

      - name: Sync LineageOS 18.1
        run: |
          mkdir -p "$ROM_DIR" && cd "$ROM_DIR"
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j$(nproc)
          rm -rf .repo
          df -h /

      - name: Device trees (yolinuxman-design, no vendor/dump blobs)
        run: |
          cd "$ROM_DIR"
          git clone --depth=1 -b main https://github.com/yolinuxman-design/device_samsung_a2corelte.git device/samsung/a2corelte
          git clone --depth=1 -b aex  https://github.com/yolinuxman-design/android_device_samsung_universal7870-common.git device/samsung/universal7870-common
          ls device/samsung/

      - name: Build images, then package
        run: |
          cd "$ROM_DIR"
          source build/envsetup.sh
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch lineage_a2corelte-userdebug
          set -o pipefail
          mka systemimage bootimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          (mka bacon 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log") || echo "BACON_FAILED (system/boot images are still valid)"
          ls -lah out/target/product/a2corelte/ | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Release artifacts
        if: hashFiles('src/out/target/product/a2corelte/boot.img') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: |
            src/out/target/product/a2corelte/boot.img
            src/out/target/product/a2corelte/system.img
            src/out/target/product/a2corelte/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
